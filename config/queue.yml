default: &default
  dispatchers: &default_dispatchers
    - polling_interval: 1
      batch_size: 500
  workers:
    - queues: "*"
      threads: 3
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
      polling_interval: 1

development:
  <<: *default

test:
  <<: *default

# production だけ worker を分ける。Solid Queue はキュー名で worker を割り当てる。
# llm キューを 1 スレッド 1 プロセスにして、ollama への依頼を直列にする。
# 注意: ここに列挙していないキューのジョブは、誰にも実行されない。
production:
  dispatchers: *default_dispatchers
  workers:
    - queues: [default]
      threads: 3
      processes: 1
      polling_interval: 1
    - queues: [llm]
      threads: 1
      processes: 1
      polling_interval: 1
